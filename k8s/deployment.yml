apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshift-cicd-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openshift-cicd-app
  template:
    metadata:
      labels:
        app: openshift-cicd-app
    spec:
      containers:
        - name: openshift-cicd-app
          image: __IMAGE_URL__
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
