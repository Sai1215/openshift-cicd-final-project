apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: oc-pipelines-oc-final
spec:
  description: Clean, clone, lint, test, build, and deploy the sample application.
  params:
    - name: repo-url
      type: string
      default: https://github.com/Sai1215/openshift-cicd-final-project.git
    - name: revision
      type: string
      default: main
    - name: image-url
      type: string
      description: Full image URL in this OpenShift project's internal image registry.
  workspaces:
    - name: shared
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: shared
    - name: git-clone
      runAfter:
        - cleanup
      taskRef:
        name: git-clone
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: shared
    - name: flake8
      runAfter:
        - git-clone
      taskRef:
        name: flake8
      workspaces:
        - name: source
          workspace: shared
    - name: nose
      runAfter:
        - flake8
      taskRef:
        name: nose
      workspaces:
        - name: source
          workspace: shared
    - name: buildah
      runAfter:
        - nose
      taskRef:
        name: buildah
      params:
        - name: image-url
          value: $(params.image-url)
      workspaces:
        - name: source
          workspace: shared
    - name: deploy
      runAfter:
        - buildah
      taskRef:
        name: openshift-client
      params:
        - name: image-url
          value: $(params.image-url)
      workspaces:
        - name: source
          workspace: shared
