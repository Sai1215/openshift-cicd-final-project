apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  description: Remove the previous workspace contents before a test run.
  workspaces:
    - name: source
  steps:
    - name: remove-old-files
      image: registry.access.redhat.com/ubi9/ubi:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -e
        find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  description: Install Python dependencies and run the project's unit tests.
  workspaces:
    - name: source
  steps:
    - name: run-nose
      image: registry.access.redhat.com/ubi9/python-311:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -e
        python -m pip install --user -r requirements.txt
        python -m pip install --user nose
        export PATH="$HOME/.local/bin:$PATH"
        nosetests -v
